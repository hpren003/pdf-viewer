<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <title>PDF 查看器</title>
  
  <!-- PDF.js 库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2a2a2a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      z-index: 100;
    }
    
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #loading .text {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    
    #pdf-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: #2a2a2a;
    }
    
    .page-wrapper {
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    
    #pdf-canvas {
      display: block;
      background: #fff;
    }
    
    /* 水印层 - 覆盖整个页面 */
    .watermark-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    
    /* 水印文字样式 */
    .watermark-text {
      position: absolute;
      font-size: 14px;
      color: rgba(128, 128, 128, 0.15);
      transform: rotate(-35deg);
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* 页码 */
    .page-number {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      padding: 10px 0;
    }
    
    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      padding: 40px;
      background: rgba(0,0,0,0.5);
      border-radius: 12px;
      max-width: 300px;
    }
    
    #error .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    #error .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    #error .message {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text">加载中...</div>
  </div>
  
  <div id="pdf-container" style="display:none;"></div>
  
  <div id="error" style="display:none;">
    <div class="icon">⚠️</div>
    <div class="title">加载失败</div>
    <div class="message" id="error-message"></div>
  </div>

  <script>
    // 获取 URL 参数
    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('url');
    const watermarkText = urlParams.get('watermark') || '仅供查阅';
    
    // 配置 PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    
    // 禁用右键菜单
    document.addEventListener('contextmenu', e => e.preventDefault());
    
    // 禁用打印
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
        e.preventDefault();
        return false;
      }
    });
    
    if (!pdfUrl) {
      showError('缺少 PDF 地址');
    } else {
      loadPdf();
    }
    
    async function loadPdf() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/cmaps/',
          cMapPacked: true,
        });
        
        const pdf = await loadingTask.promise;
        const numPages = pdf.numPages;
        
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('pdf-container');
        container.style.display = 'flex';
        
        // 缩放比例
        const scale = 1.5;
        
        // 逐页渲染
        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale });
          
          // 创建页面容器
          const wrapper = document.createElement('div');
          wrapper.className = 'page-wrapper';
          
          // 创建 Canvas
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = viewport.width + 'px';
          canvas.style.height = viewport.height + 'px';
          
          // 渲染 PDF
          const context = canvas.getContext('2d');
          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
          
          wrapper.appendChild(canvas);
          
          // 添加水印层
          const watermarkOverlay = document.createElement('div');
          watermarkOverlay.className = 'watermark-overlay';
          addWatermarks(watermarkOverlay, viewport.width, viewport.height);
          wrapper.appendChild(watermarkOverlay);
          
          container.appendChild(wrapper);
          
          // 添加页码
          const pageNumEl = document.createElement('div');
          pageNumEl.className = 'page-number';
          pageNumEl.textContent = `${pageNum} / ${numPages}`;
          container.appendChild(pageNumEl);
        }
        
      } catch (err) {
        console.error('PDF 加载失败:', err);
        showError(err.message || 'PDF 加载失败');
      }
    }
    
    function addWatermarks(container, width, height) {
      // 生成水印网格
      const watermarkCount = Math.ceil((width * height) / 50000); // 根据面积计算数量
      const actualCount = Math.max(20, Math.min(watermarkCount, 100));
      
      for (let i = 0; i < actualCount; i++) {
        const span = document.createElement('span');
        span.className = 'watermark-text';
        span.textContent = watermarkText;
        
        // 随机位置
        const x = Math.random() * width;
        const y = Math.random() * height;
        
        span.style.left = x + 'px';
        span.style.top = y + 'px';
        
        container.appendChild(span);
      }
      
      // 添加固定位置的几个明显水印
      const fixedPositions = [
        { x: width * 0.2, y: height * 0.3 },
        { x: width * 0.6, y: height * 0.5 },
        { x: width * 0.4, y: height * 0.7 }
      ];
      
      fixedPositions.forEach(pos => {
        const span = document.createElement('span');
        span.className = 'watermark-text';
        span.textContent = watermarkText;
        span.style.left = pos.x + 'px';
        span.style.top = pos.y + 'px';
        span.style.fontSize = '18px';
        container.appendChild(span);
      });
    }
    
    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error-message').textContent = message;
    }
  </script>
</body>
</html>
