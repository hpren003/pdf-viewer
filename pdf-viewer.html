<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
  <title>PDF 查看器</title>
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; font-family: -apple-system, sans-serif; }
    
    .loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #666;
    }
    .loading-icon { font-size: 48px; margin-bottom: 16px; }
    .loading-text { font-size: 14px; opacity: 0.7; }
    
    .pdf-container {
      display: none; width: 100%; height: 100%; overflow-y: auto; padding: 16px;
      background: #f5f5f5;
    }
    
    .page-wrapper {
      position: relative; margin: 0 auto 16px; background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    canvas { display: block; max-width: 100%; height: auto; }
    
    /* 水印 */
    .watermark-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden;
    }
    .watermark-item {
      position: absolute; color: rgba(150,150,150,0.2); font-size: 14px;
      font-weight: 500; white-space: nowrap; transform: rotate(-35deg);
      user-select: none;
    }
    
    .page-info {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #fff; padding: 8px 16px;
      border-radius: 20px; font-size: 12px; z-index: 99;
    }
    
    .error {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center; color: #ee0a24;
    }
    .error-icon { font-size: 48px; margin-bottom: 16px; }
    .error-text { font-size: 16px; }
    .error-hint { font-size: 12px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading-icon">📄</div>
    <div class="loading-text">正在加载PDF...</div>
  </div>
  
  <div id="pdfContainer" class="pdf-container"></div>
  <div id="pageInfo" class="page-info" style="display:none;"></div>
  
  <div id="error" class="error">
    <div class="error-icon">⚠️</div>
    <div class="error-text">PDF加载失败</div>
    <div id="errorMsg" class="error-hint"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('url');
    const watermark = decodeURIComponent(urlParams.get('watermark') || '');
    
    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('errorMsg').textContent = msg;
    }
    
    function renderWatermark(canvas, text) {
      if (!text) return;
      const wrapper = canvas.parentElement;
      const layer = document.createElement('div');
      layer.className = 'watermark-layer';
      
      const w = canvas.width, h = canvas.height;
      const gapX = 200, gapY = 150;
      const rows = Math.ceil(Math.sqrt(w*w + h*h) / gapY) + 2;
      const cols = Math.ceil(Math.sqrt(w*w + h*h) / gapX) + 2;
      
      for (let i = -cols; i < cols; i++) {
        for (let j = -rows; j < rows; j++) {
          const wm = document.createElement('div');
          wm.className = 'watermark-item';
          wm.textContent = text;
          wm.style.left = (w/2 + i * gapX) + 'px';
          wm.style.top = (h/2 + j * gapY) + 'px';
          layer.appendChild(wm);
        }
      }
      wrapper.appendChild(layer);
    }
    
    async function renderPage(pdf, num, container) {
      const page = await pdf.getPage(num);
      const containerWidth = window.innerWidth - 32;
      const viewport = page.getViewport({ scale: containerWidth / page.getViewport({scale:1}).width });
      
      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      wrapper.style.width = viewport.width + 'px';
      
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      
      wrapper.appendChild(canvas);
      container.appendChild(wrapper);
      
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      renderWatermark(canvas, watermark);
      
      document.getElementById('pageInfo').textContent = num + ' / ' + pdf.numPages;
      document.getElementById('pageInfo').style.display = 'block';
    }
    
    async function loadPdf() {
      if (!pdfUrl) { showError('缺少PDF地址参数'); return; }
      
      try {
        const pdf = await pdfjsLib.getDocument({
          url: pdfUrl,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true,
        }).promise;
        
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('pdfContainer');
        container.style.display = 'block';
        
        for (let i = 1; i <= pdf.numPages; i++) {
          await renderPage(pdf, i, container);
        }
      } catch (e) {
        console.error(e);
        showError('PDF加载失败: ' + e.message);
      }
    }
    
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    
    loadPdf();
  </script>
</body>
</html>
